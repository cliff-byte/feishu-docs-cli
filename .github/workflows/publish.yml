name: Publish

# Publishes to npm through trusted publishing (OIDC) when a GitHub release is
# published. No npm token is stored; provenance is attached automatically.
on:
  release:
    types: [published]

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # Required for npm trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # Bundles npm >= 11.5.1, required for trusted publishing
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # A poisoned cache could expose the OIDC token
      - name: Check release tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          expected="v$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "$expected" ]; then
            echo "::error::Release tag $TAG does not match package.json version $expected"
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npm publish
